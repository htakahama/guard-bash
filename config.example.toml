# guard-bash ユーザー設定の例。
# ~/.config/guard-bash/config.toml に配置するか、GUARD_CONFIG 環境変数で
# 明示的にパスを指定する。
#
# 各キーの意味は docs/config.md を参照。

[policy]
# "denylist" (default): denied のコマンドだけをブロックし、それ以外は素通しする。
#   cwd 管理と argcheck は引き続き適用される。基本的なガードは Claude Code 本体に委ねる。
# "allowlist": allowed に列挙したコマンドのみ許可する厳格モード。
# mode は model_rules のどれにも一致しなかった場合の fallback。
# mode = "denylist"

# 使用中モデル名 (transcript から取得) で mode を出し分ける。先頭一致優先。
# GUARD_POLICY_MODE が設定されている場合は model_rules は無視される (明示 override 最優先)。
# 例: Opus は信頼して denylist (素通し)、Sonnet 等は allowlist (厳格) にする
# mode = "allowlist"
# [[policy.model_rules]]
# match = "opus"
# mode  = "denylist"

# embedded default に追加で禁止したいコマンド
# extra_allowed は mode = "allowlist" のときだけ意味を持つ。
extra_allowed = [
  # "my-internal-cli",
]

# embedded default に追加で禁止したいコマンド
extra_denied = [
  # "curl",
]

[checkcd]
# cwd 以外に cd が許可される dir (サブディレクトリも含む)
allowed_dirs = [
  # "/home/user/work",
]

[argcheck]
# 無効にしたい引数チェックルールの ID リスト。
# 利用可能なルール:
#   rm-recursive-broad, git-push-force, git-reset-hard,
#   chmod-recursive-broad, chown-recursive-broad, pipe-to-shell,
#   git-dir-escape, make-dir-escape
disabled = [
  # "git-reset-hard",
]

[logging]
# "debug" | "info" | "warn" | "error"
level = "info"
# 空なら ${XDG_STATE_HOME:-$HOME/.local/state}/guard-bash/guard-bash.log
file = ""
