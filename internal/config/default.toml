[policy]
# "denylist": denied のコマンドだけをブロックし、それ以外は素通しする (cwd 管理と
#             argcheck は引き続き適用)。基本的なガードは Claude Code 本体に委ねる前提。
# "allowlist": allowed に列挙したコマンドのみ許可する厳格モード。
# mode は model_rules のどれにも一致しなかった場合の fallback としても使われる。
mode = "denylist"

# model_rules: 使用中モデル名 (transcript から取得) への部分一致で mode を出し分ける。
# 先頭から最初に一致したルールを採用。GUARD_POLICY_MODE が設定されている場合は無視される。
# 例 (Opus は信頼して素通し、それ以外は厳格にしたい場合):
#   mode = "allowlist"
#   [[policy.model_rules]]
#   match = "opus"
#   mode  = "denylist"
model_rules = []

# allowed は mode = "allowlist" のときだけ参照される。denylist モードでは無視される。
allowed = [
  # shell builtin / wrapper
  "cd", "[", "test", ":", "true", "false",
  "read", "export", "unset", "declare", "local", "let",
  "return", "shift", "wait", "trap", "getopts",
  "set", "shopt", "builtin", "hash", "enable",
  "pushd", "popd", "dirs",
  "jobs", "kill", "bg", "fg", "disown",
  "umask", "ulimit",
  "break", "continue", "exit", "logout", "suspend",
  "readonly", "typeset", "mapfile", "readarray",
  "bind", "caller", "fc", "help", "history", "times",
  "compgen", "complete", "compopt",
  "env", "command", "nice", "nohup",
  # vcs
  "git", "gh",
  # lang / build
  "cargo", "go", "node", "npm", "npx", "pnpm", "yarn", "bun", "deno",
  "python", "python3", "pip", "pip3", "uv", "uvx", "ruff", "mypy", "pyright", "pytest",
  "ruby", "gem", "bundle", "rake",
  # infra / ops
  "docker", "docker-compose", "podman", "kubectl", "helm", "terraform",
  "gcloud", "firebase", "gsutil", "bq",
  "aws", "sam", "cdk",
  "az", "func", "azd",
  # shell utilities
  "pwd", "cat", "tac", "head", "tail", "less", "more", "nl", "grep", "rg", "find", "fd", "ls", "tree", "wc", "diff", "cmp",
  "sort", "uniq", "comm", "join", "paste", "split", "column", "fold", "rev",
  "sed", "awk", "cut", "tr", "tee", "xargs", "expr", "seq", "yes",
  "echo", "printf", "printenv", "date", "whoami", "hostname", "id", "which", "type",
  "mkdir", "cp", "mv", "ln", "rm", "rmdir", "touch", "chmod", "chown",
  "tar", "gzip", "gunzip", "zip", "unzip", "xz", "bzip2", "curl", "wget",
  "jq", "yq",
  "basename", "dirname", "realpath", "readlink", "wslpath", "file", "stat", "du", "df", "uname",
  "base64", "md5sum", "sha1sum", "sha256sum", "sha512sum", "cksum",
  "od", "xxd", "hexdump",
  "sleep", "timeout", "time", "watch", "ps", "pgrep",
  # tools
  "mise", "task", "make", "cmake", "shellcheck", "shfmt",
  "rtk",
  "guard-bash",
]

denied = [
  # 破壊的ディスク操作
  "dd", "mkfs", "fdisk", "parted", "mount", "umount",
  # システム制御
  "reboot", "shutdown", "poweroff", "halt", "init", "systemctl",
  # 危険なネットワーク操作
  "iptables", "ip6tables", "nft", "tc",
  # カーネル / モジュール
  "insmod", "rmmod", "modprobe", "sysctl",
  # ユーザー / 権限昇格
  "sudo", "su", "passwd", "useradd", "userdel", "usermod", "chroot",
  # 動的実行 / evaluation
  "eval", "exec", "source", ".",
]

extra_allowed = []
extra_denied  = []

[checkcd]
allowed_dirs = []

[argcheck]
disabled = []

[logging]
level = "info"
file  = ""
